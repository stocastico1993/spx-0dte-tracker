name: Raccolta dati 0DTE SPX

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-0dte
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Raccogli snapshot 0DTE
        run: python collect_0dte.py

      - name: Salva i dati nel repo (commit automatico)
        run: |
          mkdir -p data
          git config user.name "0dte-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nessun nuovo dato da salvare"
          else
            git commit -m "Snapshot 0DTE $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase
            git push
          fi
