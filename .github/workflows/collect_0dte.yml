name: Raccolta dati 0DTE SPX

on:
  schedule:
    - cron: '*/15 13-19 * * 1-5'
    - cron: '0 20 * * 1-5'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install requests

      - name: Raccogli snapshot 0DTE
        run: python collect_0dte.py

      - name: Salva i dati nel repo (commit automatico)
        run: |
          git config user.name "0dte-bot"
          git config user.email "actions@github.com"
          git add 0dte_history.csv
          git diff --staged --quiet || git commit -m "Snapshot 0DTE $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
